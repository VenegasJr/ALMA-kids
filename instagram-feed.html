<!-- Sección de Instagram Feed - Puede insertarse en cualquier parte del sitio -->
<section id="instagram-feed" class="instagram-section">
    <div class="container">
        <div class="instagram-header">
            <div class="instagram-title-wrapper">
                <i class="fab fa-instagram"></i>
                <div>
                    <h2 class="section-title">Síguenos en Instagram</h2>
                    <p class="instagram-subtitle">@almakids.cl - Comparte la magia de nuestros eventos</p>
                </div>
            </div>
            <a href="https://www.instagram.com/almakids.cl/" target="_blank" class="btn-instagram-follow">
                <i class="fab fa-instagram"></i>
                Seguir
            </a>
        </div>
        
        <!-- Estadísticas de Instagram -->
        <div class="instagram-stats" id="instagramStats">
            <div class="stat-item">
                <div class="stat-number" id="followerCount">-</div>
                <div class="stat-label">Seguidores</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="postCount">-</div>
                <div class="stat-label">Publicaciones</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="followingCount">-</div>
                <div class="stat-label">Siguiendo</div>
            </div>
        </div>
        
        <!-- Feed de Instagram -->
        <div class="instagram-feed-container" id="instagramFeed">
            <div class="instagram-loading">
                <i class="fab fa-instagram"></i>
                <p>Cargando publicaciones de Instagram...</p>
            </div>
        </div>
        
        <!-- Botón para ver más -->
        <div class="instagram-footer">
            <a href="https://www.instagram.com/almakids.cl/" target="_blank" class="btn btn-primary btn-instagram-view">
                <i class="fab fa-instagram"></i>
                Ver más en Instagram
            </a>
        </div>
    </div>
</section>
